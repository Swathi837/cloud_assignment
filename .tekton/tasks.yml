apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: cleanup
      image: python:3.11
      script: |
        #!/usr/bin/env python
        echo "Cleaning up temporary files..."
        find . -type d -name "__pycache__" -exec rm -rf {} +
        find . -type f -name "*.pyc" -delete
        echo "Cleanup completed."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  steps:
    - name: run-tests
      image: python:3.11
      script: |
        #!/usr/bin/env python
        python -m pip install --upgrade pip
        pip install nose
        echo "Running unit tests..."
        nosetests
